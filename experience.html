<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tensi — Construction Collaboration. Connected.</title>
<style>
  :root {
    --bg: #00090a;
    --panel: #001416;
    --white: #f5f2ec;
    --muted: rgba(245, 242, 236, 0.55);
    --amber: #ffcd00;
    --line: rgba(245, 242, 236, 0.14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Inter', 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    overflow-x: hidden;
  }

  /* ---------------- Intro sequence ---------------- */
  #intro {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
  }
  .scene {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.1s ease;
  }
  .scene.active { opacity: 1; pointer-events: auto; }

  .scene-inner {
    position: relative;
    text-align: center;
    padding: 0 32px;
    max-width: 1100px;
  }

  .cinematic-line {
    font-size: clamp(28px, 5vw, 56px);
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.3;
    color: var(--white);
  }

  /* Scene 1 — blueprint reveal */
  #scene-1 .backdrop {
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, var(--line) 0 1px, transparent 1px 96px),
      repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 96px);
    opacity: 0;
    transition: opacity 2.4s ease;
  }
  #scene-1.active .backdrop { opacity: 0.35; }
  #scene-1 .scanline {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255, 205, 0, 0.55), transparent);
    transform: translateY(-10%);
    opacity: 0;
  }
  #scene-1.active .scanline { animation: scan 3.2s ease-in-out 0.2s 1 forwards; }
  @keyframes scan {
    0% { opacity: 0; transform: translateY(-10%); }
    12% { opacity: 1; }
    88% { opacity: 1; }
    100% { opacity: 0; transform: translateY(110%); }
  }
  #scene-1 .cinematic-line {
    opacity: 0;
    transform: translateY(18px);
  }
  #scene-1.active .cinematic-line { animation: fadeUp 1.1s ease 1.6s 1 forwards; }

  /* Scene 2 — progressive words */
  #scene-2 .word-stack { position: relative; height: 120px; width: 100%; }
  #scene-2 .word {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(30px, 5.5vw, 60px);
    font-weight: 700;
    color: var(--muted);
    opacity: 0;
  }
  #scene-2 .word.final { color: var(--white); font-weight: 800; letter-spacing: -0.5px; }
  #scene-2.active .w1 { animation: flash 0.85s ease 0.0s 1 forwards; }
  #scene-2.active .w2 { animation: flash 0.85s ease 1.1s 1 forwards; }
  #scene-2.active .w3 { animation: flash 0.85s ease 2.2s 1 forwards; }
  #scene-2.active .w4 { animation: flash 0.85s ease 3.3s 1 forwards; }
  #scene-2.active .final { animation: fadeUp 0.9s ease 4.55s 1 forwards; }
  @keyframes flash {
    0% { opacity: 0; transform: translateY(10px); }
    20% { opacity: 1; transform: translateY(0); }
    78% { opacity: 1; }
    100% { opacity: 0; }
  }
  #scene-2 .converge {
    position: absolute; inset: 0; pointer-events: none;
  }
  #scene-2 .dot {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--amber);
    opacity: 0;
    top: 50%; left: 50%;
  }
  #scene-2.active .dot { animation: converge 4.6s ease 0.1s 1 forwards; }
  #scene-2 .dot:nth-child(1) { --dx: -42vw; --dy: -32vh; animation-delay: 0.1s; }
  #scene-2 .dot:nth-child(2) { --dx: 40vw; --dy: -28vh; animation-delay: 0.3s; }
  #scene-2 .dot:nth-child(3) { --dx: -38vw; --dy: 30vh; animation-delay: 0.5s; }
  #scene-2 .dot:nth-child(4) { --dx: 44vw; --dy: 26vh; animation-delay: 0.7s; }
  @keyframes converge {
    0% { opacity: 0; transform: translate(var(--dx), var(--dy)); }
    10% { opacity: 0.8; }
    85% { opacity: 0.5; transform: translate(0, 0); }
    100% { opacity: 0; transform: translate(0, 0); }
  }

  /* Scene 3 — direction */
  #scene-3 .backdrop {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(255, 205, 0, 0.07), transparent 60%);
    opacity: 0;
    transition: opacity 2.6s ease;
  }
  #scene-3.active .backdrop { opacity: 1; }
  #scene-3 .line-a, #scene-3 .line-b {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(28px, 5vw, 54px);
    font-weight: 700;
    opacity: 0;
  }
  #scene-3.active .line-a { animation: holdFade 2.3s ease 0.0s 1 forwards; }
  #scene-3.active .line-b { animation: fadeUp 1.0s ease 2.8s 1 forwards; }
  @keyframes holdFade {
    0% { opacity: 0; transform: translateY(14px); }
    17% { opacity: 1; transform: translateY(0); }
    83% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Scene 4 — wordmark + scroll cue */
  #scene-4 .wordmark {
    font-size: clamp(64px, 10vw, 128px);
    font-weight: 800;
    letter-spacing: -3px;
    opacity: 0;
    transform: scale(0.92);
  }
  #scene-4 .wordmark .si { color: var(--amber); }
  #scene-4.active .wordmark { animation: logoIn 1.0s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s 1 forwards; }
  @keyframes logoIn {
    to { opacity: 1; transform: scale(1); }
  }
  #scene-4 .tagline {
    margin-top: 18px;
    font-size: clamp(16px, 2vw, 22px);
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0;
    transform: translateY(10px);
  }
  #scene-4.active .tagline { animation: fadeUp 0.8s ease 1.1s 1 forwards; }
  #scene-4 .scroll-cue {
    position: absolute;
    bottom: 56px; left: 50%;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted);
    opacity: 0;
  }
  #scene-4.active .scroll-cue { animation: fadeUp 0.8s ease 1.9s 1 forwards, bob 1.8s ease-in-out 2.7s infinite; }
  @keyframes bob {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, 8px); }
  }
  #scene-4 .arrow { font-size: 18px; }

  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(18px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ---------------- Page 2 stub ---------------- */
  #page-2 {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--panel);
    color: var(--muted);
    font-size: 18px;
    letter-spacing: 1px;
  }

  @media (prefers-reduced-motion: reduce) {
    .scene, #scene-1 .cinematic-line, #scene-2 .word, #scene-2 .dot, #scene-3 .line-a,
    #scene-3 .line-b, #scene-4 .wordmark, #scene-4 .tagline, #scene-4 .scroll-cue {
      animation: none !important;
      transition: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }
</style>
</head>
<body>

<section id="intro" aria-label="Tensi opening experience">

  <!-- Scene 1 — Every project starts somewhere (0-5s) -->
  <div class="scene" id="scene-1">
    <div class="backdrop"></div>
    <div class="scanline"></div>
    <div class="scene-inner">
      <div class="cinematic-line">EVERY PROJECT STARTS WITH AN IDEA.</div>
    </div>
  </div>

  <!-- Scene 2 — Turning ideas into reality (5-11s) -->
  <div class="scene" id="scene-2">
    <div class="converge">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="scene-inner">
      <div class="word-stack">
        <div class="word w1">Drawings.</div>
        <div class="word w2">Information.</div>
        <div class="word w3">People.</div>
        <div class="word w4">Decisions.</div>
        <div class="word final">ALL MOVING TOGETHER.</div>
      </div>
    </div>
  </div>

  <!-- Scene 3 — Set the Tensi direction (11-16s) -->
  <div class="scene" id="scene-3">
    <div class="backdrop"></div>
    <div class="line-a">CONSTRUCTION MOVES FAST.</div>
    <div class="line-b">COLLABORATION SHOULD TOO.</div>
  </div>

  <!-- Scene 4 — Enter the experience (16-20s, then holds) -->
  <div class="scene" id="scene-4">
    <div class="scene-inner">
      <div class="wordmark">ten<span class="si">si</span></div>
      <div class="tagline">Construction Collaboration. Connected.</div>
    </div>
    <div class="scroll-cue">
      <span>Scroll to experience Tensi</span>
      <span class="arrow">↓</span>
    </div>
  </div>

</section>

<section id="page-2">
  Page 2 — coming soon
</section>

<script>
  // Autoplaying scene timeline per the Page 1 brief:
  // Scene 1: 0-5s, Scene 2: 5-11s, Scene 3: 11-16s, Scene 4: 16-20s (then holds).
  var scenes = [
    { id: 'scene-1', at: 0 },
    { id: 'scene-2', at: 5000 },
    { id: 'scene-3', at: 11000 },
    { id: 'scene-4', at: 16000 },
  ];

  scenes.forEach(function (s, i) {
    setTimeout(function () {
      document.getElementById(s.id).classList.add('active');
      var prev = scenes[i - 1];
      if (prev) document.getElementById(prev.id).classList.remove('active');
    }, s.at);
  });

  // NOTE: no audio wired in yet. The brief calls for a premium cinematic
  // score + subtle construction ambience with no narration on Page 1 —
  // intentionally left out until a licensed/sourced track is supplied,
  // rather than reusing an unrelated bundled track.
</script>

</body>
</html>
