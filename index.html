{cat:"Sydney",diff:"hard",q:"What's your biggest risk and what's the contingency?",a:"JAY: Speed to market. AI is moving fast. The window of being first with a purpose-built construction AI tool in ANZ is open now and shrinking. If we don't move quickly, we lose the first-mover comfort. The market is there, the problem is real, and that won't last forever. JUSTIN'S ANGLE (financial risk side): there's also a money risk. The $1.2M is not going to last forever. Getting the word out costs money. If we burn through cash and haven't gotten enough customers in, we're in trouble. So our contingency on the financial side: we know the timeline, we're already live in alpha generating feedback, and the raise is sized specifically to get us to seed-ready metrics — not to over-extend on a long timeline. We're being deliberate about runway and milestones. We don't have unlimited time and we know it. That's why we're moving now.",why:"Justin's financial risk angle is the honest second risk. Speed to market + money runway = both founders' real concerns."},
{cat:"Sydney",diff:"hard",q:"What stops Procore or Autodesk from building exactly what you're building?",a:"JAY: We saw it live at Sydney Build Expo. They've integrated AI but plugged it on top of legacy systems. That's a fundamentally different product to one built AI-native from day one. JUSTIN'S HONEST PUSHBACK (important — don't oversell this): we don't actually know what Procore is building behind the scenes. They have money, more money than us. They have the resources. If they had the idea, they could move. So we don't pretend they can't compete — we say the realistic truth: implementation in a legacy enterprise system takes time, the environment and adjustments to roll out for a different segment is slow, and they have to manage existing customer expectations. Critically — Tier 2 and 3 builders aren't their primary customers. Cannibalising their enterprise pricing to serve SMEs doesn't make business sense for them. So while they could build it, the structural reasons not to are real. By the time they decide, we have the data, the users, and the network density built. The honest answer isn't 'they can't' — it's 'they're slower and structurally disincentivised.'",why:"Justin's honest pushback — don't claim they CAN'T do it, claim they're slower and disincentivised. More credible."},
{cat:"Sydney",diff:"medium",q:"Why are you the right team to build this?",a:"JAY: We saw the problem as founders — we're living it every day. 25 years for Justin in HVAC and design, 15 years for me in mechanical contracting. We have the industry know-how, and through Giri, Sudhi, and the team we have the tech know-how. JUSTIN'S ANGLE (the strongest part of this): when we brought Giri and the others on, it didn't take much convincing at all. They saw it immediately despite having no construction background. People with 24 years of UX experience, 4 patents, Cisco scale platforms — these aren't people who waste time on something they're not convinced about. The fact that they got on board with this much conviction, from outside our domain, IS the validation. You can't fake that. You can't get someone with 4 patents to commit to a startup unless they actually believe the problem is real. That's our independent validation — and it's not about us, it's about the problem being so obvious that people from completely different industries see it instantly. Industry know-how + tech know-how + conviction across the team = the right team to build this.",why:"Justin's 'they didn't need much convincing' framing is the answer. Outsiders with no domain skin instantly converted = real problem."},
{cat:"Sydney",diff:"medium",q:"Do you expect a board seat or advisory role with this raise?",a:"We don't need a board at this stage. What we want is an active investor. Someone who picks up the phone when we need advice. Someone with industry knowledge and network who helps us grow. Not someone who just reads a quarterly report and attends a meeting. We want guidance, knowledge, and connections — that's the real value at this stage. The governance can come later at seed when it makes sense.",why:"You said it directly: 'We want knowledge, network, guidance — not governance.' That's the answer."},
{cat:"Sydney",diff:"standard",q:"Why start in Australia and not go global from day one?",a:"You have to get it right here first. We know this market. We have credibility here. We have existing relationships with builders, consultants, and trades who already know and trust us. We can move faster in a market we understand than one we're cold-entering. Once the model is proven — the product, the GTM motion, the pricing — the expansion playbook is clear. Going global too early is how companies burn through capital and end up with nothing to show anywhere.",why:"Simple and direct. Get it right here first. Then the playbook writes itself."}
];

const ALL_Q=[...Q,...SYDNEY];
const cats=['All','⭐ Sydney','Market','Product & AI','Team','Financials','Equity & Deal','Risk','Vision & Exit','Founder'];
let idx=0,flipped=false,done=new Set(),filt='All',filtered=[...ALL_Q],txS=0,tyS=0,drag=false;

function init(){
  bTabs();bDrw();render();uProg();uStats();
  const ca=document.getElementById('ca');
  ca.addEventListener('touchstart',ts,{passive:true});
  ca.addEventListener('touchmove',tm,{passive:false});
  ca.addEventListener('touchend',te,{passive:true});
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight')next();
    else if(e.key==='ArrowLeft')prev();
    else if(e.key===' '){e.preventDefault();flip();}
  });
}

function tTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  document.getElementById('tb').textContent=next==='dark'?'☀':'☾';
  try{localStorage.setItem('tensi-theme',next);}catch(e){}
}

function bTabs(){
  document.getElementById('tabs').innerHTML=cats.map(c=>{
    const isSyd=c==='⭐ Sydney';
    const isActive=c==='All';
    return`<button class="tab${isActive?' active':''}${isSyd?' sydney-tab':''}" onclick="sF('${c}',this)">${c}</button>`;
  }).join('');
}

function sF(cat,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  filt=cat;
  if(cat==='All') filtered=[...ALL_Q];
  else if(cat==='⭐ Sydney') filtered=[...SYDNEY];
  else filtered=Q.filter(q=>q.cat===cat);
  idx=0;flipped=false;document.getElementById('fc').classList.remove('flipped');
  render();uProg();bDrw();
}

function render(){
  if(!filtered.length)return;
  const c=filtered[idx];
  document.getElementById('fcat').textContent=c.cat;
  document.getElementById('fnum').textContent=String(idx+1).padStart(2,'0');
  document.getElementById('fq').textContent=c.q;
  const d=document.getElementById('fdiff');
  d.textContent=c.diff.charAt(0).toUpperCase()+c.diff.slice(1);
  d.className='diff '+c.diff;
  document.getElementById('bqt').textContent=c.q;
  let h='';
  if(c.nums){
    h+=`<div class="nbox">${c.nums.split('|').map(s=>{const p=s.trim().split(':');return p.length>1?`<b>${p[0]}:</b>${p.slice(1).join(':')}`:s.trim();}).join('<br>')}</div>`;
  }
  h+=`<div class="albl">Answer</div><div class="abody">${c.a}</div>`;
  h+=`<div class="wbox"><div class="wlbl">Why They Ask This</div><div class="wbody">${c.why}</div></div>`;
  document.getElementById('bb').innerHTML=h;
  document.getElementById('bb').scrollTop=0;
  const gi=ALL_Q.indexOf(c);
  const db=document.getElementById('dbtn');
  db.classList.toggle('marked',done.has(gi));
  db.textContent=done.has(gi)?'✓ Practised':'✓ Done';
}

function uProg(){
  const t=filtered.length,c=idx+1;
  document.getElementById('pl').textContent=`Q ${c} of ${t}`;
  document.getElementById('pp').textContent=Math.round((idx/Math.max(t-1,1))*100)+'%';
  document.getElementById('pf2').style.width=((idx/Math.max(t-1,1))*100)+'%';
}

function uStats(){
  document.getElementById('dc2').textContent=done.size;
  document.getElementById('dd').textContent=done.size;
  document.getElementById('dt').textContent=ALL_Q.length;
  document.querySelectorAll('.dqic').forEach((el,i)=>{
    const gi=ALL_Q.indexOf(filtered[i]);
    el.classList.toggle('done',done.has(gi));
    el.textContent=done.has(gi)?'✓':'';
  });
}

function bDrw(){
  document.getElementById('dl').innerHTML=filtered.map((c,i)=>{
    const gi=ALL_Q.indexOf(c);
    return`<div class="dqi${i===idx?' cur':''}" onclick="gTo(${i});cDrw()">
      <span class="dqin">${String(i+1).padStart(2,'0')}</span>
      <span class="dqit">${c.q}</span>
      <span class="dqic${done.has(gi)?' done':''}">${done.has(gi)?'✓':''}</span>
    </div>`;
  }).join('');
}

function gTo(i){idx=i;flipped=false;document.getElementById('fc').classList.remove('flipped');render();uProg();bDrw();}
function flip(){flipped=!flipped;document.getElementById('fc').classList.toggle('flipped',flipped);}

function next(){
  if(idx<filtered.length-1){idx++;flipped=false;document.getElementById('fc').classList.remove('flipped');render();uProg();bDrw();}
  else{document.getElementById('csd').textContent=done.size;document.getElementById('cst2').textContent=filtered.length;document.getElementById('cscreen').classList.add('show');}
}

function prev(){
  if(idx>0){idx--;flipped=false;document.getElementById('fc').classList.remove('flipped');render();uProg();bDrw();}
}

function tDone(){
  const gi=ALL_Q.indexOf(filtered[idx]);
  done.has(gi)?done.delete(gi):done.add(gi);
  render();uStats();bDrw();
}

function restart(){document.getElementById('cscreen').classList.remove('show');gTo(0);}
function oDrw(){document.getElementById('drw').classList.add('open');document.getElementById('ov').classList.add('open');}
function cDrw(){document.getElementById('drw').classList.remove('open');document.getElementById('ov').classList.remove('open');}

function ts(e){txS=e.touches[0].clientX;tyS=e.touches[0].clientY;drag=false;}
function tm(e){
  const dx=e.touches[0].clientX-txS,dy=e.touches[0].clientY-tyS;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>10){
    drag=true;e.preventDefault();
    document.getElementById('sfl').classList.toggle('show',dx<-30);
    document.getElementById('sfr').classList.toggle('show',dx>30);
  }
}
function te(e){
  document.getElementById('sfl').classList.remove('show');
  document.getElementById('sfr').classList.remove('show');
  if(!drag)return;
  const dx=e.changedTouches[0].clientX-txS;
  if(Math.abs(dx)>60){dx<0?next():prev();}
  drag=false;
}

// Restore saved theme immediately
try{
  const saved=localStorage.getItem('tensi-theme');
  if(saved){
    document.documentElement.setAttribute('data-theme',saved);
  }
}catch(e){}

window.addEventListener('load',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const tb=document.getElementById('tb');
  if(tb)tb.textContent=cur==='dark'?'☀':'☾';
  setTimeout(()=>{document.getElementById('splash').classList.add('hidden');init();},1500);
});
</script>
