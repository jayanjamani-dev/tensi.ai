<script>
const Q=[
{cat:"Market",diff:"standard",q:"What makes this problem urgent and worth solving now?",a:"Honestly — it's not urgent. It's late. We should have had this years ago. Labour shortages mean every hour of a tradesperson's time is more expensive than five years ago. Documentation requirements from councils are increasing. Project timelines are tighter. And yet the average builder is still opening five PDFs, switching between email, WhatsApp, and three different tools just to answer one question about a drawing. Think about the person uploading the same documents every single day, searching manually for one item — doing the same boring task they did yesterday. That person's capacity should go toward thinking creatively — how do we build this better, how do we solve this faster. We're taking away the groundwork they find boring so they can focus on what actually matters. AI search and mobile workflows are available right now. Nobody in Australia is deploying them properly for the SME segment. The window is open today. In two years it won't be.",why:"Lead with the human cost — the person doing boring repetitive work. That image landed in your real conversation. Then close with the timing window."},
{cat:"Market",diff:"standard",q:"Why will builders and tradies use Tensi instead of Procore or Aconex?",a:"Procore and Aconex are traditionally enterprise-level software targeting Tier 1. I've looked at Procore myself — I'm reasonably tech-savvy and I get lost in it. If I'm getting lost, imagine a tradie on site who just wants one answer and has no time to figure out how to navigate the system. These builders and trades don't have time to think about how to use a tool. They want to get stuff done quickly. That's been our core design principle — quick and easy — because we know the customer. We are the customer. Second: affordability. Procore pricing doesn't make sense for a 10-person builder. That builder doesn't need all the features built for Tier 1 enterprise. They need what they actually use, at a price that fits their size. We're entering a market with a big audience that hasn't been properly served and building specifically for them.",why:"The 'I get lost in Procore myself' line is gold. Use it."},
{cat:"Market",diff:"standard",q:"What proof do you have that users want this?",a:"The most honest answer: we didn't invent the problem. We've lived it. Justin has been running a design and drafting firm for years. Every single day, builders and consultants call him asking where something is in a drawing set. Same question, different job, different person — consistently. That's not anecdotal. Before we built anything, we sat down with customers — and we are the customers. We spoke to around 20 builders, consultants, and trades. The feedback was clear: they could see the value immediately and kept asking when they could use it. That's before we wrote a single line of code. Then we built it, showed it to them, they found it useful. We have LOIs signed and a confirmed waitlist. But the most compelling proof isn't a document — it's years of Justin's phone ringing with the same question. That problem doesn't go away on its own.",why:"Lead with the lived experience — it's more powerful than LOIs. The years-long pattern is your strongest signal."},
{cat:"Market",diff:"medium",q:"What specific feedback have you received from the market?",a:"Consistent across all the people we spoke to — builders, architects, consultants, trades. Same problem, different faces. The traditional way hasn't changed: uploading documents manually, opening PDFs one by one, searching through pages for one detail. We talked to around 20 people before we built anything. The response was: yes, this is a real problem, yes this would help. Also — there's a solution like this in the US already. People there have access to it. In Australia, there's nothing. So the market is already validated internationally. It just hasn't been served here. The problem exists, it's been proven worth solving, and nobody here is filling the gap yet.",why:"The US market comparison is powerful. Proves validation without you having to do it from scratch."},
{cat:"Market",diff:"hard",q:"How do you know this isn't niche — just a few builders you happen to know?",a:"Construction is roughly 10% of Australia's GDP. That's one of the largest industries in the country — 493,000 registered businesses, 2 million employees. Procore has a multi-billion dollar market cap. Aconex was acquired by Oracle for over a billion dollars. The problem is validated at global scale. We're going after the 97% of construction businesses with fewer than 20 employees — the ones Procore pricing and complexity excludes. Tier 3 is the biggest market. Most of them are using Google Drive and WhatsApp because nothing affordable and simple has been built for them. That's not niche. That's the majority of the industry.",why:"Lead with construction's share of GDP, then the incumbent valuations, then the untapped SME majority."},
{cat:"Market",diff:"medium",q:"How do you plan to acquire customers without burning cash?",a:"Construction is relationship-driven. Cold outreach doesn't work here — trust does. Our first customers come from Justin's existing network of builders and consultants who already know and respect him. Mine come from 15 years of mechanical contracting relationships. We're not buying leads — we're converting warm relationships through direct conversations, site visits, and short demos. Once a builder is on the platform, they invite trades and consultants. Customer acquisition cost in the early phase is essentially our time. Paid channels come later, only for the tiers where the LTV supports it.",why:"Relationship-driven sales is your strength. No paid ads talk at this stage."},
{cat:"Market",diff:"hard",q:"How do you compete against free tools — WhatsApp, Google Drive, email?",a:"Those tools are the problem we're solving, not our competition. A builder using WhatsApp for messages, Google Drive for files, email for RFIs, Bluebeam for markup, and PDFs for drawings — that's five tools, zero integration, daily switching cost. The real expense isn't software. It's the 30 minutes a tradie spends finding a detail that should take 10 seconds. It's the RFI that sat in someone's inbox for three days. It's the rework bill from an outdated drawing. Tensi replaces that entire fragmented stack with one workflow. The subscription cost is trivial compared to one day of rework on a residential build.",why:"Reframe free tools as the cause of the pain, not the competition."},
{cat:"Market",diff:"hard",q:"Sales at $12–40K ACV requires a real sales motion. Who closes deals?",a:"Justin and I close every deal at this stage — and that's not a weakness, it's the right model. At $12,000 to $40,000 ACV, you're selling trust as much as software. A builder sitting across from someone who's managed HVAC installations and chased RFIs on real jobs is a completely different conversation than talking to a salesperson who's never been on a site. We speak their language, understand their workflows, answer technical questions without checking with the product team. That credibility closes deals in this industry. The playbook we build through the first 30 customers becomes the hire brief for our first commercial role.",why:"Engineering founders selling is a trust advantage in relationship-driven industries."},
{cat:"Product & AI",diff:"hard",q:"Your AI makes claims about construction drawings. What happens when it's wrong?",a:"Every answer Tensi returns shows the source drawing, the page number, and the specific location — not a black box. It's a search result with a citation. The user verifies before they act. We are decision support, not an autonomous decision-maker. Our terms are clear on that distinction. Professional accountability sits with the person making the decision, not the tool that surfaced the information. We track versions so answers always point to the current revision, and we flag superseded drawings. The AI reduces the risk of human error. It doesn't eliminate accountability.",why:"Source attribution is your liability answer. Know it cold."},
{cat:"Product & AI",diff:"medium",q:"How does your AI actually work on construction drawings?",a:"Uploaded drawings are processed through our document intelligence layer — PDFs parsed, elements extracted, content indexed for semantic search. When a user asks 'what's the head height on the door to the plant room on level 3' — the system retrieves the relevant drawing location and returns the answer with a direct source reference. We use Gemini API at Tier 1 for the language layer. Document processing runs through the Foxit API. The construction-specific intelligence comes from how we've structured the indexing — we understand drawing conventions and the typical information architecture of ANZ construction document sets. Accuracy improves over time as we collect real domain data from actual projects.",why:"Focus on what it does, where accuracy comes from, how it improves."},
{cat:"Product & AI",diff:"hard",q:"AI costs scale with usage. How does your margin hold up?",a:"We identified this early and it's designed into the architecture. The fix is query caching. In construction, the same questions get asked repeatedly across a project — door specs, services clearances, structural details. Those answers get cached the first time they're retrieved. Every subsequent similar request returns from cache rather than hitting the model fresh. Cost scales with unique queries, not total queries — and in construction, unique queries are a fraction of total queries. We've modelled this at 1,200 paying customers. Infrastructure costs stay controlled. This was a design decision made upfront, not a patch after costs blew out.",why:"If you know caching cold, you win this question."},
{cat:"Product & AI",diff:"medium",q:"How long does it take a new user to get value from Tensi?",a:"Seconds. You upload a drawing and you search. The answer comes back in seconds. That's the design requirement we hold ourselves to in every release. Our users — trades on site, small builder teams, consultants under time pressure — have zero tolerance for a learning curve. If there's any friction between opening the product and getting an answer, we've already lost them. They'll go back to WhatsApp. Zero-training UX isn't a feature. It's the condition under which this product works or doesn't work.",why:"'Seconds' is the answer. Short, sharp, confident."},
{cat:"Product & AI",diff:"standard",q:"What's your product roadmap for the next 12–15 months?",a:"Month 3: DMS Enhancement. Month 5: Submittal Workflow and 3D Model Walkthrough. Month 6: AI Agents. Month 7: Collaboration Infrastructure. Month 9: AI Search Infrastructure. Month 12: AI Voice Agent. Month 15: Mobile App. Each milestone increases daily active use, increases switching cost, and adds a new data layer that deepens the AI moat. The sequence is deliberate — not features for a roadmap slide. We're building the product that makes Tensi the default platform for construction document intelligence in ANZ.",why:"Know the month numbers — they're in the deck."},
{cat:"Product & AI",diff:"medium",q:"What stops Tensi from becoming another cluttered construction tool?",a:"Discipline. Every feature goes through one test: does it reduce the number of steps for the user or increase them? If it increases them, it doesn't ship. We have a customer advisory group — real builders, trades, and consultants — who test every release before it goes live. If they find it confusing or slow, we fix it before it reaches the wider user base. We are deliberate about what we don't build. The 3D model viewer, tendering module, financial tools — those are on the roadmap for later because they're not what drives daily use right now.",why:"Show active discipline, not just good intentions."},
{cat:"Product & AI",diff:"hard",q:"You're dependent on Google Gemini API. What if they change pricing or cut access?",a:"We've already lived this. Early in development we hit a quota issue on Gemini's free tier. We moved to paid Tier 1 and the problem went away. That taught us we can't treat any single API provider as an unconditional dependency. So we built the architecture so the model layer can be swapped. The workflow logic, document indexing, and interface — none of that is tied to Gemini specifically. If Google changes pricing dramatically, we move to an alternative without rebuilding the product. The data and workflow are ours regardless of what model runs underneath. That's a structural decision, not an aspiration.",why:"Having lived through this and fixed it is more credible than saying the risk doesn't exist."},
{cat:"Product & AI",diff:"medium",q:"How do you handle version control across drawing revisions?",a:"Every drawing upload is versioned. The system tracks revision history and always points AI answers to the latest version. When a user uploads a new revision, the old one stays in the log with its timestamp — but it's clearly marked as superseded and won't surface in search results unless the user specifically asks. This solves one of the most expensive problems in construction: people making site decisions based on outdated drawings. The cost of acting on a superseded drawing can run into tens of thousands of dollars on a real project.",why:"Show you've solved the real version control problem, not just storage."},
{cat:"Team",diff:"hard",q:"You have multiple co-founders. Who's running this? What happens if one leaves?",a:"Roles are clear, no overlap. I run product strategy, investor relations, and GTM. Justin runs operations and industry relationships. Giri owns technical architecture. Sriram owns operations execution. Sudhi owns design. Decisions are made by the domain owner — we don't run everything by committee. Founder agreements covering equity, vesting, and departure are in place. One departure is a setback, not a shutdown. The knowledge, code, and relationships aren't concentrated in one person.",why:"Clarity of roles and legal structure remove founder-drama risk."},
{cat:"Team",diff:"hard",q:"You also run a mechanical contracting business. Are you actually full-time on Tensi?",a:"The contracting business serves two purposes that directly benefit Tensi. First, it gives me access to live construction projects — real drawings, real RFIs, real workflows — so I'm continuously testing Tensi against the exact use cases it's built for. That's live product research I couldn't buy. Second, it funds my cost of living so I'm not drawing unnecessary salary from Tensi's runway. Capital efficiency. The plan is clear: as the round closes and Tensi requires full operational attention, I step back from contracting. That transition is already planned and doesn't create a gap.",why:"Frame it as R&D and capital efficiency. Commit to the transition without being defensive."},
{cat:"Team",diff:"medium",q:"Why are you the right team to build this?",a:"Because we've lived every part of this problem. Justin has 25 years in civil engineering and HVAC contracting. I have 15 years in engineering and construction. We've managed projects, handled RFIs, dealt with drawing chaos on active sites. What's remarkable is what happened when we brought the rest of the team on. Giri has 24 years in tech architecture and AI systems, four patents, global-scale platform experience at Cisco. No construction background. Sudhi has 24 years in design with 14 international awards. Also no construction background. It didn't take much convincing for any of them. When experienced people with no stake in the industry look at this problem and still get on board — that's independent validation. We have the industry know-how AND the tech know-how. That combination is rare.",why:"The Giri and Sudhi angle is powerful — independent conviction in the problem from domain outsiders."},
{cat:"Team",diff:"medium",q:"What's Justin's role and why does it matter?",a:"Justin is Co-Founder and Head of Product. He IS the customer. Every day his design and drafting firm works with Tier 2 builders on real ANZ construction projects. The problems Tensi solves are problems he faces in his own business every week. He doesn't need to do user research because he is the user. That gives us an insight advantage no amount of customer discovery calls can replicate. His industry network is also our most direct GTM channel. When he recommends Tensi to a builder who already trusts him, it lands completely differently than a cold sales message.",why:"Justin is a strategic asset. Don't undersell having the customer as co-founder."},
{cat:"Team",diff:"medium",q:"Have you worked together before? How do you handle disagreements?",a:"We built the full alpha together — that's the real test of whether a founding team works. We've been through technical failures, scope changes, late nights, an AWS cost spike that needed immediate diagnosis, and the pressure of an alpha launch deadline. We came through all of it aligned and on time. Disagreements happen and they get resolved fast. Each person owns their domain — when there's a decision to be made, it goes to the person who owns that area. Clear ownership means faster resolution.",why:"Show resilience through real examples. The alpha build is your proof of team cohesion."},
{cat:"Team",diff:"medium",q:"What does Giri bring that you couldn't get by hiring a senior engineer?",a:"24 years building AI systems and technical architecture. Four patents. Global-scale platform experience at Cisco. But more importantly — Giri is a co-builder with equity and conviction, not a contractor with an hourly rate. A senior engineering hire optimises for their job description. Giri optimises for the long-term architecture of a business he co-owns. He designed the system to scale to 10,000 users, not 100. He built the model layer so it's swappable. These are architectural decisions a contractor wouldn't make because they're not paid to think five years ahead.",why:"Technical credibility reduces the biggest risk investors see in early-stage AI SaaS."},
{cat:"Financials",diff:"hard",q:"Why $1.2M? How did you arrive at that number?",nums:"47% Product Dev (~$564K) | 27% Talent (~$324K) | 14% Marketing & GTM (~$168K) | 12% Ops & Infra (~$144K)",a:"$1.2 million is calculated, not aspirational. Every dollar is allocated. 47% to product development — engineering work to deliver the roadmap milestones: DMS enhancement, 3D model walkthrough, AI agents, collaboration infrastructure, AI search, voice agent, mobile app. 27% to talent — primarily a full-time front-end developer immediately, plus planned hires as the product scales. 14% to marketing and GTM — sales rep, LinkedIn ads, industry expo presence, email automation, CRM. 12% to operations and infrastructure — cloud hosting, embedded software APIs, platform costs. Less than $1.2 million compresses the timeline below what we need to reach seed-ready metrics. There's no padding.",why:"Know the allocation percentages cold: 47/27/14/12."},
{cat:"Financials",diff:"hard",q:"What's your valuation and how do you justify it with no revenue?",nums:"Pre-money: ~$9–10M AUD | Post-money (at $1.2M): ~$10.2M | ANZ pre-seed SaaS median: $7–10M",a:"Our pre-money valuation is $9 to $10 million. At pre-seed with no revenue, valuation isn't a multiple calculation — it's a judgment of team quality, product stage, and market opportunity. On team: 130+ years of combined experience across construction, AI, design, and operations. Giri has 4 patents and built global-scale platforms at Cisco. On product: alpha is live as of April 9 with real users. This is not a pitch deck — it's a working product. On market: $700 million serviceable ANZ market, $12 billion globally, no credible AI-native competitor in our segment. We're squarely in the range for ANZ pre-seed SaaS with a working product and a team of this depth.",why:"Team depth, product stage, market size. The valuation is defensible on all three. No apology."},
{cat:"Financials",diff:"hard",q:"What equity does $1.2M buy? Walk me through the dilution math.",nums:"Pre-money $9M + $1.2M = Post-money $10.2M | Investor equity: ~11.8% | Founders retain: ~88.2%",a:"At a $9 million pre-money valuation, a $1.2 million investment creates a post-money valuation of $10.2 million. The investor receives approximately 11.8% of the company. Founders retain approximately 88.2%. If we're using a SAFE, the investor converts at this cap at the next priced round — typically seed. If seed is raised at $20 to $25 million pre-money — a reasonable expectation if we hit our targets — the pre-seed investor's 11.8% was bought at half the price. That's the return profile for early conviction.",why:"Know this instantly. $9M + $1.2M = $10.2M post. $1.2M ÷ $10.2M = 11.76%. Memorise it."},
{cat:"Financials",diff:"hard",q:"What if you only give us $500K instead of $1.2M?",nums:"$500K at $9M pre-money = ~5.3% equity | $500K runway = ~7–8 months | $1.2M = 18 months",a:"At a $9 million pre-money, $500,000 buys approximately 5.3% equity. But the more important question is what $500K gets you versus $1.2M — they're different businesses 18 months from now. $500K gets us to roughly 50 paying customers and product-market fit signals. Runway is approximately 7 to 8 months — tight. $1.2M gets us to 150 or more paying customers, mobile live, AI accuracy materially improved, and seed-ready metrics. A company with 150 paying customers raises seed on very different terms than one with 50.",why:"Know the equity math at different investment levels. $500K = 5.3%. Have it cold."},
{cat:"Financials",diff:"hard",q:"What if I want 20% equity?",nums:"20% at $9M pre-money requires ~$2.25M | OR implies pre-money of ~$4.8M for $1.2M — below market",a:"For 20% at our valuation, you'd need to invest approximately $2.25 million — more than we're raising. If you're suggesting 20% for $1.2 million, that implies a pre-money valuation of $4.8 million. We don't think that reflects where we are — a working product in alpha, 130+ years of combined team experience, signed LOIs, a confirmed waitlist, and zero prior capital taken. $4.8 million pre-money for a pre-revenue AI SaaS with a live product is below the ANZ market benchmark. We're open to structural conversation — timing discount, pro-rata rights, information rights — but the base valuation reflects what the company is genuinely worth.",why:"Confident, non-defensive. Know what 20% implies mathematically."},
{cat:"Financials",diff:"medium",q:"What's your burn rate and how long does $1.2M last?",nums:"$1.2M ÷ 18 months = ~$67K/month avg burn | Founders not drawing market-rate salary from Tensi",a:"$1.2 million over 18 months implies an average burn of approximately $67,000 per month. Not evenly distributed — early months are lower, later months increase as the sales motion scales. The burn is controlled by two things: Justin and I are not drawing market-rate salaries from Tensi right now — our personal businesses cover our living costs. And we have a staged hiring plan — we don't hire roles before we need them. 18 months takes us to the customer count, retention, and usage metrics that make a seed round competitive.",why:"Know your implied monthly burn: ~$67K/month. Don't fumble basic arithmetic."},
{cat:"Financials",diff:"hard",q:"Your projections go from zero to $2.2M revenue in 2027. Walk me through the assumptions.",nums:"2027: 150 companies × ~$14.7K avg ACV = $2.2M ARR | 2028: 350 | 2029: 600 | 2030: 800 | 2031: 1,200 / $16M ARR",a:"$2.2 million ARR in 2027 is 150 companies at an average annual contract value of approximately $14,700. That blends Starter at $6,000, Pro at $12,000, and Business at $40,000 — weighted toward Pro because that's the primary direct outreach target. 150 companies in the first 12 to 18 months of a funded GTM operation is roughly 8 to 10 new paying customers per month from direct outreach, referrals, and network effects. We have a warm pipeline starting from Justin's existing clients and my contracting network. The first 50 come from relationships we already have.",why:"150 companies × $14.7K avg ACV = $2.2M. Know the customer count and the ACV mix by tier."},
{cat:"Financials",diff:"medium",q:"What does success look like at the end of the $1.2M raise?",a:"50 to 150 paying customers with strong daily active use. A steady increase in active users month on month. AI accuracy consistently above our internal benchmark. A net promoter score that tells us customers would genuinely miss Tensi if it disappeared. And metrics strong enough to go into a seed round with confidence. Customer count, retention rate, daily active use, AI query volume — the signals that show the product is forming habits, not just being trialled. Where we're putting the money and what comes out of it — that's how we measure success.",why:"You said this clearly: 'where we're putting the money and what the output is — that's the validation.'"},
{cat:"Financials",diff:"hard",q:"What's your LTV:CAC ratio?",nums:"Pro tier ACV: $12K/yr | 3-yr LTV: ~$36K | Founder-led CAC: ~$2–5K | Target LTV:CAC: >5:1",a:"At the Pro tier — $1,000 per month, $12,000 annually — a three-year LTV is approximately $36,000. Our CAC during the founder-led phase is primarily time cost, roughly $2,000 to $5,000 per customer. That gives us an LTV:CAC ratio well above 5:1. As we move to paid acquisition, CAC increases — which is why we only deploy paid channels on the $1,000 and $3,000 per month tiers where LTV supports it. The Starter tier grows organically — effectively zero cash CAC. The unit economics work because we've designed acquisition around LTV at each tier.",why:"Know the numbers for each tier. Show the math."},
{cat:"Financials",diff:"hard",q:"What's your gross margin? Cost per customer?",nums:"Infrastructure at 1,200 users: $230–500/month | Per-customer: ~$0.20–0.42/month | Target gross margin: >75%",a:"SaaS gross margins at scale run 70 to 85%. We're targeting above 75%. The primary cost of serving a customer is infrastructure — cloud hosting on AWS Sydney, AI API costs, and Foxit document processing. At 1,200 paying customers, we've modelled total infrastructure at $230 to $500 per month — roughly $0.20 to $0.42 per customer per month. The main variable is AI processing cost, which we've addressed through query caching. Margins improve as the customer base grows because fixed costs spread across more accounts.",why:"Know your infrastructure number and the caching strategy that protects margin."},
{cat:"Financials",diff:"medium",q:"Have you had prior funding or taken on any debt?",nums:"External capital raised: $0 | Bootstrapped: Jan 2025 – present | Debt: None | Cap table: 100% founding team",a:"Zero external capital. No debt. We've been entirely self-funded from January 2025 — over 16 months of building without a single dollar from outside the team. Every line of code, every design decision, every infrastructure cost covered by the founding team. The cap table is completely clean. No prior investors, no convertible notes, no debt obligations, no complicated preference structures. You're coming into a clean, unencumbered company with a working product. We didn't raise money and then start building. We built first, got to alpha, and now we're raising to accelerate.",why:"A clean cap table and zero prior debt is a significant positive. Lead with it."},
{cat:"Equity & Deal",diff:"hard",q:"What's the cap table before this raise?",nums:"Current ownership: 100% founding team | No external shareholders | No prior debt | Clean structure",a:"The cap table is entirely held by the founding team right now. No external shareholders, no prior investors, no advisors with equity stakes. The founding team equity is split across Jay, Justin, Giri, Sriram, Sudhi, Navdeep, and Prarthan based on roles, contributions, and agreed vesting schedules. We share the specific split in formal conversation once there's mutual intent on both sides. What you need to know: the cap table is clean, the team has appropriate equity to remain motivated through the growth phase, and this raise is the first external dilution event. No skeletons, no overhangs.",why:"Confirm it's clean and the team is incentivised. Specific split at term sheet stage."},
{cat:"Equity & Deal",diff:"medium",q:"What vesting schedule do the founders have?",nums:"Standard: 4-year vesting | 1-year cliff | Monthly vesting after cliff",a:"Four-year vesting with a one-year cliff — standard for ANZ early-stage companies. The cliff means if any founder departs in the first year, they walk away with nothing and the equity goes back into the pool. After the cliff, vesting is monthly for the remaining three years. Every founder still here at year four has fully earned their equity through contribution. It signals to investors that the founding team is committed to the long game.",why:"Investors ask about vesting to check founder commitment and protect against early departures."},
{cat:"Equity & Deal",diff:"hard",q:"SAFE or priced round? What are the terms?",nums:"Instrument: SAFE | Cap: $9–10M pre-money | Discount: 15–20% | MFN clause: yes",a:"We're using a SAFE — Simple Agreement for Future Equity — standard for Australian pre-seed in 2026. It closes faster than a priced round, legal costs are significantly lower for both sides, and avoids a full valuation negotiation until seed when there's more data. Key terms: valuation cap of $9 to $10 million pre-money, a discount rate of 15 to 20% giving early investors preferential pricing at conversion, and a most-favoured-nation clause — if we issue a subsequent SAFE on better terms before conversion, existing holders automatically get those same terms.",why:"Know the SAFE structure cold. Cap, discount rate, MFN clause."},
{cat:"Equity & Deal",diff:"medium",q:"Do you have an employee option pool?",nums:"Pool target: 10–12% of post-raise cap table | Standard ANZ pre-seed: 10–15%",a:"We're establishing an employee option pool as part of this raise — approximately 10 to 12 percent of the post-raise cap table. This gives us room to attract senior engineering, AI, and commercial talent through to seed without going back to create more pool at an awkward time. The pool is specifically for team members — not advisors or service providers. Primarily used for technical hires in the roadmap and a commercial role once the GTM playbook is proven.",why:"Option pool size matters. Investors want to know dilution is accounted for and you can attract talent."},
{cat:"Equity & Deal",diff:"medium",q:"Do you offer pro-rata rights?",nums:"Pro-rata rights: available for lead or significant investors | Protects against dilution at seed",a:"Yes. We offer pro-rata rights to investors who lead the round or contribute a meaningful portion. Pro-rata means when we raise seed, those investors have the right to maintain their ownership percentage by participating in the new round at new terms. It's a standard investor protection. For an investor who comes in early at the pre-seed cap and believes in the trajectory, pro-rata is how you protect your position against dilution at seed.",why:"Standard ask from sophisticated investors. Know what it means and offer it confidently."},
{cat:"Equity & Deal",diff:"medium",q:"Do you expect a board seat or advisory role?",a:"We don't need a board at this stage — it's early and we need to move fast. What we want is more valuable: an active investor. Someone who picks up the phone when we need advice. Someone with construction industry connections or SaaS scaling experience who opens doors. Someone who's been through the seed and Series A process and can help us prepare before we're in the middle of raising. We don't want someone who reads a quarterly report and attends a meeting. If there's an investor with specific value to add, we're open to a formal advisory role. The relationship matters more than the title.",why:"Active engagement over governance overhead."},
{cat:"Risk",diff:"hard",q:"What's your biggest risk and what's the contingency?",a:"Two risks. First: speed to market. The AI space is moving fast and the advantage of being first with a purpose-built construction AI tool in ANZ is a window, not a permanent state. If we don't move quickly with a product customers want, that window shrinks. Contingency: alpha is live, we're in front of customers now, and the raise accelerates the timeline significantly. Second: adoption speed. Construction users are resistant to new tools — they've been burned by expensive software that required months of training and still didn't work on site. Our response is the product itself — zero-training UX, customer advisory group testing every release. And AI accuracy: one wrong answer erodes trust faster than any number of correct ones can rebuild. Source attribution on every answer is non-negotiable.",why:"Speed to market is the most honest primary risk. Shows strategic awareness."},
{cat:"Risk",diff:"hard",q:"What stops Procore or Autodesk from building exactly what you're building?",a:"We saw this live at Sydney Build Expo. Procore is integrating AI — but look at how. They've taken what they already built and plugged a generic AI layer on top. They haven't built AI-native from day one. That's a fundamentally different product. Their system was built for complexity. Simplifying it for SMEs isn't a feature update — it's a different product that cannibalises their enterprise pricing. They have no incentive to do it well. Could they build something like Tensi in the background? Maybe. But they move slowly, their customer base expects the complex system to stay complex, and every month we're in market is domain data, user habits, and network density they can't quickly replicate. The Tier 2 and 3 builders are not their primary customers.",why:"The Sydney Build Expo observation is real and specific — use it."},
{cat:"Risk",diff:"hard",q:"What if you burn through cash faster than expected?",a:"Our personal businesses — my mechanical contracting firm and Justin's design firm — give us financial stability without drawing from Tensi's capital. That's the first buffer. If burn accelerates, we have two levers: reduce GTM spend — the first 50 customers come through direct outreach from Justin and me, which costs time but not significant cash. And defer non-critical hires — the roadmap has flexibility in sequencing. The thing we don't cut is engineering quality. A broken product accelerates churn faster than any burn rate problem. We've modelled both base and aggressive burn scenarios and know which line items get cut first.",why:"Show resilience and scenario planning without sounding desperate."},
{cat:"Risk",diff:"medium",q:"What if construction adoption is slower than expected?",a:"We've designed for this. The product works on first use — no training, no setup, no implementation project. Our first customers come through warm relationships, not cold outreach, so the trust barrier is already lower. If adoption is slower than the base case, we extend runway by slowing hiring and focusing resources on the customers who are already engaged. A slower start doesn't invalidate the product — it delays the timeline. The problem doesn't go away. Slow adoption is a sequencing risk. It's not a viability risk.",why:"Show you've planned for the slow scenario."},
{cat:"Risk",diff:"hard",q:"What about professional indemnity and liability for an AI construction tool?",a:"Professional indemnity insurance is our higher priority over general public liability — specifically because of AI output exposure. Cyber liability is also in place given we handle sensitive project documentation. Our terms of service explicitly define Tensi's AI as a search and decision support tool — not a certified or verified output. The user remains the responsible professional. We've structured the ToS to reflect this cleanly and taken legal advice on the liability layer. This is not something we've left to figure out later.",why:"Mature investors ask this. A clear answer builds serious credibility."},
{cat:"Risk",diff:"hard",q:"What if AI accuracy isn't good enough and users lose trust?",a:"Trust in AI is built incrementally and lost instantly — we know that. Every answer shows its source. The user always knows which drawing, which page, which revision the answer came from. If the AI is wrong, the user can see exactly why and flag it. That feedback goes directly into our accuracy improvement process — every flagged error is a training signal. We also set accuracy expectations correctly. We don't tell users the AI is perfect. We tell them it surfaces information faster with a clear source. The accountability for the decision still sits with the professional.",why:"Active accuracy management and honest expectation-setting are your answers here."},
{cat:"Vision & Exit",diff:"standard",q:"Where do you see Tensi in 5 years?",a:"Two outcomes — both good for you as an investor. Either we're a strong acquisition target, or we're expanding internationally. The companies that would acquire us — Procore, Autodesk, Trimble, Aconex, Nemetschek — don't have a footprint in the ANZ SME segment. When we've built density in ANZ, it's far easier for them to acquire us than roll out their own product at this price point and simplicity level. They're selling at premium enterprise pricing. We're building what they can't profitably reach. The other path: we continue growing, expand into markets where these players also have limited footprint, and control construction document intelligence across ANZ and the broader region.",why:"'Easier to buy us than build it at this price point' — that line came from your real conversation. Use it."},
{cat:"Vision & Exit",diff:"hard",q:"What's the exit strategy and realistic timeline?",nums:"Acquisition interest: 18–30 months | Serious negotiations: 500–1,000 companies (3–4 yrs) | Acquirers: Procore, Autodesk, Trimble, Aconex/Oracle, Nemetschek",a:"Most credible near-term exit: acquisition. Global construction platforms — Procore, Autodesk, Trimble, Aconex, Nemetschek — all lack deep drawing intelligence for ANZ SMEs. Tensi is an attractive target once we've proven ANZ market density. Early acquisition interest is realistic at 18 to 30 months. More serious negotiations happen at 500 to 1,000 paying companies — roughly 3 to 4 year horizon. At 1,200 companies with $16 million ARR, at 5 to 8 times revenue multiple, that's an $80 million to $128 million exit. At 11.8% equity the pre-seed investor is looking at $9.4 million to $15.1 million return on $1.2 million invested. Precedent: Aconex was acquired by Oracle for approximately $1.2 billion AUD in 2018.",why:"Named acquirers, specific triggers, specific timeline, precedent deal."},
{cat:"Vision & Exit",diff:"hard",q:"What multiple do I get on my money?",nums:"1,200 customers / $16M ARR × 5x = $80M exit | × 8x = $128M | At 11.8%: $9.4M–$15.1M return | 7.8–12.6x on $1.2M",a:"Conservative scenario: by 2031 we're at 1,200 paying companies and approximately $16 million ARR. A SaaS business at our projected growth rate with strong retention trades at 5 to 8 times revenue at acquisition. At 5 times — $80 million exit. At 8 times — $128 million. At 11.8% equity, that's a return of $9.4 million to $15.1 million on a $1.2 million investment. That's a 7.8 to 12.6 times multiple. In a more optimistic scenario — faster growth, earlier acquisition, strategic premium — those numbers move materially higher. Pre-seed investors get the best entry point and most upside.",why:"Have this calculation memorised. Investors want numbers, not adjectives."},
{cat:"Vision & Exit",diff:"medium",q:"Why start in Australia? Why not go global from day one?",a:"ANZ is our proving ground and it's a deliberate choice, not a limitation. English-language, high-activity construction market, underserved by enterprise players, and we have existing relationships and credibility here. We can move faster in a market we understand than one we're cold-entering. The ANZ market alone is large enough to build a strong, fundable, acquirable business. Once the model is proven — product-market fit, GTM motion, pricing — the expansion playbook writes itself. Going global too early is how companies burn through capital and end up with nothing to show anywhere.",why:"Focus beats premature global ambition."},
{cat:"Vision & Exit",diff:"medium",q:"What's your expected seed round size and timeline?",nums:"Seed target: $3–5M | Expected timing: 12–18 months post pre-seed | Implied seed pre-money: $20–30M",a:"We expect to close this pre-seed in the next 60 to 90 days and deploy immediately. 12 to 18 months from close, we'll have the customer count, retention data, and usage metrics to go into a seed round competitively. We're targeting a seed raise of $3 to $5 million at a pre-money valuation of $20 to $30 million — roughly double to triple the pre-seed valuation. That uplift is what pre-seed investors are being compensated for with the lower entry price today.",why:"Show the raise is part of a planned sequence."},
{cat:"Financials",diff:"hard",q:"What's your minimum viable raise if you can't close the full $1.2M?",nums:"Full raise: $1.2M → 18 months, full roadmap | Minimum viable: ~$800K → 12 months, core product only | Below $800K: runway risk",a:"We have a minimum viable raise in mind — approximately $800,000. At that level we can fund the core product roadmap and run a leaner GTM operation for 12 months. It's not the plan we want, but it's a plan that works. Below $800,000, the runway compresses to under 12 months and we'd be back raising before we've had time to prove the model — that's a bad position for a seed round. If the round comes in below target, we'd prioritise product development over GTM spend, move more slowly on commercial hires, and focus on getting the first 20 to 30 paying customers through direct outreach. The personal businesses of both founders provide a financial buffer that means a slower close doesn't create an immediate crisis. But $1.2 million is the right number to execute the plan we've committed to.",why:"Having a minimum viable raise shows discipline. Investors respect founders who know their floor, not just their ask."},
{cat:"Financials",diff:"hard",q:"Walk me through exactly how you're spending the $1.2M — line by line.",nums:"Product Dev 47% ~$564K | Talent 27% ~$324K | Marketing & GTM 14% ~$168K | Ops & Infra 12% ~$144K",a:"47 percent — approximately $564,000 — goes to product development. This covers the engineering work to deliver the roadmap: DMS enhancement at month 3, submittal workflow and 3D model walkthrough at month 5, AI agents at month 6, collaboration infrastructure at month 7, AI search infrastructure at month 9, AI voice agent at month 12, and mobile app at month 15. 27 percent — approximately $324,000 — goes to talent acquisition. Primarily a full-time front-end developer immediately, and other hires as the product scales. 14 percent — approximately $168,000 — goes to marketing and GTM: a sales rep, LinkedIn advertising, industry expo presence, email automation, and a CRM. 12 percent — approximately $144,000 — goes to operations and infrastructure: cloud hosting, embedded software APIs, and platform costs. The split is product-heavy deliberately — at this stage the product is the sales tool and the retention mechanism.",why:"You must be able to walk through this allocation from memory. 47/27/14/12. Know what each bucket covers."},
{cat:"Financials",diff:"medium",q:"Why is 47% going to product? Shouldn't you spend more on sales?",a:"At this stage, the product is the sales tool. When a builder sits in a demo and sees their own drawings being searched in seconds, that closes the deal — not a sales deck. At a $12,000 to $40,000 annual contract value with a relationship-driven sales motion, the quality and reliability of the product is what creates the trust that converts a prospect to a paying customer. We don't need a large marketing budget to find our first 50 customers — we need a product that works so well they tell other people. The 14 percent GTM allocation covers a sales rep, LinkedIn ads, industry expos, and CRM — enough to run a focused direct outreach motion in ANZ. We increase the GTM allocation at seed as the product stabilises and acquisition cost per customer becomes more predictable.",why:"Product-heavy allocation at pre-seed is correct and defensible. The product is the conversion tool at this ACV."},
{cat:"Financials",diff:"hard",q:"What roles are you hiring with the talent budget? Who specifically?",nums:"Immediate: Full-time front-end developer | Planned: Mobile app partner (Aritha, contract) | Later: First commercial hire post-GTM validation",a:"The talent allocation funds two immediate hires and one planned hire. First — a full-time front-end developer. The product roadmap from month 3 onwards requires dedicated front-end capacity that the current team can't absorb without slowing the roadmap. This hire is the most time-sensitive. Second — a mobile app development partner. We've identified Aritha for this contract engagement, and mobile is scheduled for month 15. The mobile partner is a contract rather than a full-time hire because mobile development has a defined scope. Third — a commercial hire once the direct outreach GTM model is proven. We don't hire this person until we've done 20 to 30 customer conversations ourselves and know exactly what the playbook looks like. Hiring a sales rep before you understand the sales motion is one of the most common early-stage mistakes. We're not making it.",why:"Named hires, specific timing, clear reasoning. Vague answers about 'growing the team' lose credibility."},
{cat:"Financials",diff:"medium",q:"What's your target churn rate and what drives retention?",nums:"Target monthly churn: <2% | Annual implied: <22% | Retention drivers: workflow embedding, version control dependency, project network effect",a:"We're targeting monthly churn below 2 percent, which implies annual churn below 22 percent — acceptable for an early-stage vertical SaaS with a growing product. The retention drivers are structural, not just satisfaction-based. Once a builder's project drawings are indexed in Tensi, the cost of leaving is real — they'd need to re-upload and re-index elsewhere. That's a switching cost we build into the onboarding. The RFI and version control workflows create daily habits — a product you use every day for a core function is hard to leave. And when your project team is in Tensi, coordinating a migration to another tool requires convincing everyone in the network, not just the person who signed the contract. Churn is a risk we take seriously. Every customer who leaves is a failure we analyse.",why:"Churn is a key SaaS health metric. Know your target, know your retention drivers, show switching cost is built into the architecture."},
{cat:"Financials",diff:"medium",q:"How do you plan to expand revenue per customer over time?",nums:"Starter: $500/month → Pro: $1,000/month → Business: $3,333/month | NRR target: >110%",a:"Revenue expansion per customer happens through two mechanisms. First, tier upgrades — as a Starter customer grows their project volume, adds team members, and gets value from more advanced features, they naturally move to Pro or Business. The product is designed so the value proposition of higher tiers becomes obvious with usage, not through a sales call. Second, seat expansion — as more of a customer's project team adopts Tensi, the value of the platform increases and the case for higher-tier features becomes clearer. We're targeting net revenue retention above 110 percent, meaning the revenue from existing customers grows faster than we lose from churn. That's the metric that tells you whether your product is genuinely delivering value or just being tolerated.",why:"NRR above 100% means your existing customers are growing. That's the most powerful SaaS metric. Know what drives it."},
{cat:"Equity & Deal",diff:"medium",q:"Are you raising from one lead investor or a syndicate?",nums:"Target: Single lead preferred for clean cap table | Open to: Aligned syndicate where each investor adds strategic value | Min ticket: to be discussed",a:"We're open to both structures. A single lead who can bring the full $1.2 million is the cleanest outcome — one cap table entry, one relationship to manage, faster close. But we're also open to a syndicate of aligned investors if each brings strategic value beyond the cheque — construction industry networks, SaaS scaling experience, or access to the seed round. What we're not doing is diluting the cap table with a large number of small cheques from people who add no value. Every investor at this stage needs to earn their place. We have a minimum ticket in mind and we're focused on closing the round efficiently rather than leaving it open indefinitely.",why:"Shows you're running a disciplined raise, not taking every cheque you can get."},
{cat:"Equity & Deal",diff:"hard",q:"If you can't raise the full $1.2M, what equity do you offer at $200K, $500K, $600K, $800K, $1M?",nums:"Pre-money valuation: $10.8M (fixed) | $1.2M = 10% equity | Same valuation applies at every level",a:"Our pre-money valuation is fixed at $10.8 million regardless of cheque size. At that valuation, here is exactly what each amount buys and what it gets us:\n\n$200,000 → 1.82% equity | 3 months runway. Not enough. Gets us to 5 to 10 customers but we'd be back raising in 3 months with minimal proof. We would politely decline this or counter with a different structure — a cheque this size doesn't move the needle and creates a distraction.\n\n$500,000 → 4.42% equity | 7 to 8 months runway. Viable but suboptimal. Gets us to roughly 50 paying customers and early product-market fit signals. Enough to survive but not enough to reach seed-ready metrics. We'd want a committed follow-on conversation before accepting.\n\n$600,000 → 5.26% equity | 9 months runway. Acceptable if paired with a clear path to seed or a bridge commitment. Gets us to 50 to 70 paying customers. Workable but tight.\n\n$800,000 → 6.90% equity | 12 months runway. Our strong minimum. Gets us to 80 to 100 paying customers — sufficient to prove product-market fit and have a credible seed conversation. This is the floor we'd accept as a standalone cheque.\n\n$1,000,000 → 8.47% equity | 15 months runway. Very good. Gets us to 100 to 130 paying customers with strong traction and a solid seed position. We'd actively try to close the gap to $1.2M alongside this.\n\n$1,200,000 → 10.00% equity | 18 months runway. The right number. Executes the full plan — 150 plus paying customers, mobile live, AI accuracy proven, seed-ready. This is what we're raising and why.",why:"Know every number in this table cold. If an investor offers less, you respond instantly with the exact equity percentage, the runway it buys, and what that gets you. No hesitation, no fumbling. The $800K floor is your line — below that, politely decline or restructure."},
{cat:"Equity & Deal",diff:"hard",q:"What equity does $1.2M buy? Walk me through the dilution math.",nums:"Pre-money $10.8M + $1.2M = Post-money $12M | Investor equity: 10% | Founders retain: 90%",a:"At a $10.8 million pre-money valuation, a $1.2 million investment creates a post-money valuation of $12 million. The investor receives exactly 10% of the company. Founders retain 90%. If we're using a SAFE, the investor converts at this cap at the next priced round — typically seed. If seed is raised at $20 to $25 million pre-money — a reasonable expectation if we hit our targets — the pre-seed investor's 10% was bought at half the price. That's the return profile for early conviction. Every dollar invested at this stage buys equity at the lowest price it will ever be.",why:"Know this instantly. $10.8M pre + $1.2M = $12M post. $1.2M ÷ $12M = 10.0%. Memorise it."},
{cat:"Founder",diff:"hard",q:"You built this while working full time and managing a family. Why is that confidence, not concern?",a:"Because it means we ship under real constraints. Not in a funded bubble with 18 months of runway and no other obligations — with full-time businesses, family commitments, and zero margin for wasted effort. Every decision had to count because we couldn't afford to iterate endlessly. We launched alpha on April 9. That happened while Justin was running his design firm, while I was running the contracting business, while both of us were managing our families. That's not in spite of those constraints — that's proof we execute regardless of them. Most startups burn through a seed round before they launch a product. We launched before we had one. If you're asking what we'll do with $1.2 million behind us — look at what we did with none.",why:"Your single strongest proof of execution. End with that last line. Deliver it with conviction."},
{cat:"Founder",diff:"hard",q:"What have you personally sacrificed to get Tensi to this point?",a:"Nights and weekends for over a year, consistently. We self-funded every dollar — no salary from Tensi, no external capital, no safety net. The contracting business keeps the lights on at home, and every hour outside of that went into Tensi. I'm not saying this for sympathy. I'm saying it because it tells you something about what we believe this is worth and how seriously we're taking it. We've already been through the hard part — building with nothing, launching under pressure — and we're still here. The commitment isn't a promise about the future. It's already demonstrated.",why:"Don't perform sacrifice. Be factual. The commitment is demonstrated, not promised."},
{cat:"Founder",diff:"hard",q:"How do you know you and Justin will stay aligned as pressure increases?",a:"We've already been through the pressure. Building without funding, while running full-time businesses, while managing a product launch deadline — that is pressure. We had disagreements during the alpha build. We resolved them. The reason we resolved them fast is that the roles are clear: Justin owns product and industry decisions, I own strategy and commercial decisions. When there's a disagreement inside someone's domain, the domain owner decides. That clarity removes the ambiguity that causes most co-founder tension. We haven't had a breakdown. We've had a product launch. The relationship has already been tested under conditions that would end most partnerships. We're still here, still building, still aligned.",why:"The alpha build is the proof. Use it."},
{cat:"Founder",diff:"medium",q:"Justin runs a design and drafting firm. Isn't that a conflict of interest?",a:"It's the opposite — it's our biggest unfair advantage. That firm is our live research lab. Every project Justin's team works on is a real Tensi use case. When a builder sends through 200 drawings and his team needs to navigate them, that's exactly the problem Tensi solves — and we see it happening in real time, not through a customer discovery call. The firm also gives us a reference customer with a real before-and-after story. And it funds Justin's cost of living so he's not drawing unnecessary salary from Tensi's capital. If you designed the ideal validation environment for a construction software startup, it would look exactly like Justin's firm.",why:"Flip this hard. It's a research lab, a reference customer, and a financial buffer simultaneously."},
{cat:"Founder",diff:"hard",q:"Have you ever failed at something significant? What did you learn?",a:"Running your own business teaches you failure constantly — it's continuous calibration. The most important thing I've learned is that the gap between a technically correct solution and one that people actually use is enormous, and that gap is almost always a UX and trust problem, not a technical one. I've built things that solved what I thought users needed rather than what they actually needed. Tensi is built on that lesson. Every feature goes through real users before it ships. Every assumption is tested against actual behaviour. The failure history is the reason we have a customer advisory group, a zero-training UX standard, and an obsession with step count. Those aren't features. They're lessons.",why:"Honest failure answers build more trust than polished success stories."},
{cat:"Founder",diff:"hard",q:"What would have to happen for you to walk away from Tensi?",a:"The market would have to prove that builders and trades are genuinely satisfied with the tools they have — that the pain we're solving doesn't exist. That's not what we see. Every conversation with someone in the industry reinforces that the pain is real and current tools aren't solving it. Or the team would have to break beyond repair. We've stress-tested that through the alpha build. Short of those two things — we're not walking away. We've invested too much in time, money, and personal credibility, and the problem is too real. Walking away is the one option we haven't planned for.",why:"Answer without hesitation. Any pause here loses the room."},
{cat:"Founder",diff:"medium",q:"How do you balance being a founder with family life?",a:"Honestly — it's hard, and we won't pretend it isn't. What we've learned is that the people at home understand why we're doing this, and that understanding matters more than perfect balance. Build time is build time. Family time is protected as much as we can protect it. The businesses fund the stability that lets us do both — we're not in financial stress while building Tensi, which is important because financial stress on top of startup stress would be unsustainable. Our families are part of this journey. They know what we're building and why. That support is real.",why:"Don't perform balance. Be honest that it's hard. Show the support structure is real."},
{cat:"Founder",diff:"hard",q:"If I back you, what am I actually getting beyond the product?",a:"Two founders who built a working product under maximum constraint without any external capital. A team with over 130 years of combined experience across construction, AI, design, and operations — not as a list of credentials, but people who apply that experience to every product decision. The only construction SaaS team in ANZ who are also their own daily customer, which means the product improves continuously from real project use. And founders who will not waste your capital — not because we're cautious, but because we know exactly what it costs to build without it, and we're not going to take that for granted.",why:"Direct and grounded. Answer like you mean every word."},
{cat:"Founder",diff:"medium",q:"What keeps you up at night about Tensi?",a:"Two things. AI accuracy at the moment a tradie makes a costly site decision based on an answer we returned. We think about that constantly — which is why source attribution is non-negotiable and accuracy benchmarks are part of every release. One wrong answer on a live site can break trust that took months to build. And adoption speed. Every month we're not embedded in a builder's workflow is a month they could be pulled toward something else. Both are solvable engineering and sales problems. But they're the ones I think about when I should be sleeping.",why:"Self-awareness and active risk management. Don't pretend nothing worries you."},
{cat:"Founder",diff:"hard",q:"You've both run your own businesses. Why take on investors at all?",a:"We've already proven what we can do without external capital — we built to alpha without it. The next phase requires a pace that self-funding on the side of full-time businesses can't sustain. The construction software window is open right now. AI-native tools are becoming the baseline expectation. We don't want to be late because we were too cautious about taking capital. The right investor accelerates timing and opens doors in a relationship-driven industry. That's what we need — not just capital.",why:"Shows you chose investors deliberately, not out of desperation."},
{cat:"Founder",diff:"hard",q:"What's the one thing about you personally that makes Tensi more likely to succeed?",a:"I've never built something I didn't believe in completely. With Tensi, it runs deeper than any previous project because I'm not building something for a market I discovered — I'm building the answer to a problem I've lived. I understand what a builder needs because I've been the person who needed it. I understand what trades will and won't tolerate because I've worked with them for 15 years. And I'm not doing this for the exit story. I'm doing it because the construction industry I've worked in deserves better tools, and I'm in the specific position to build them.",why:"Personal conviction question. Speak from the gut."},
{cat:"Founder",diff:"hard",q:"Give me one sentence — why should I write the cheque?",a:"Two founders with 40 years of combined industry experience, a live product with real users, a team with over 130 years of collective depth across construction, AI, design, and operations — built entirely without external capital, while running businesses and raising families — and we are just getting started.",why:"Memorise this word for word. Deliver it without a pause. This is your close."}
];

const SYDNEY=[
{cat:"Sydney",diff:"hard",q:"What market validation do you actually have?",a:"Before we built anything, we sat down with our customers — and we are the customers. We spoke to around 20 people. They said yes, this is a problem, this would help. Then we built it and showed it to them. They found it useful and kept asking when they could start using it. But honestly the most real validation is years of Justin's phone ringing with the same question — where is this in the drawings? We didn't invent the problem. We also know the market has been validated in the US already. There's nothing in Australia. That's the gap we're filling.",why:"Lead with the lived experience. The years of the same phone call is more convincing than any survey."},
{cat:"Sydney",diff:"hard",q:"I've never invested in construction tech. Convince me this is a real market.",a:"Construction is about 10% of GDP. It's a problem every contractor, builder, and architect faces every single day. It's not a short-term fix — it fundamentally changes how people work. It saves time, improves efficiency, reduces cost. The market has already been proven in the US. Nothing exists in Australia. Being first here gives us a competitive advantage. We already have alpha release and are getting real feedback. The problem is real, the timing is right, and nobody here is solving it.",why:"Lead with GDP, then the US validation, then first-mover advantage in ANZ."},
{cat:"Sydney",diff:"standard",q:"What makes this problem urgent and worth solving right now?",a:"Honestly it's not urgent — it's late. The industry has been doing things the same way for years. But now AI makes it possible to solve it properly. Think about the person uploading the same documents every day, doing the same boring search — their capacity should be used for creative thinking, not admin. That's what we're taking away. The boring groundwork. So they can focus on what actually matters. And nobody in Australia is doing this properly yet. That window is open today. In two years it won't be.",why:"You said 'it's not urgent — it's late.' That line is powerful. Use it exactly."},
{cat:"Sydney",diff:"standard",q:"Why will builders and tradies use Tensi instead of Procore or Aconex?",a:"Procore and Aconex are enterprise-level. I'm reasonably tech-savvy and I get lost in Procore. If I'm getting lost, imagine a tradie on site — they don't have time to figure it out. They just want to get stuff done. Quick and easy is our design principle because we are the customer. We know what they need because we are them. And on affordability — a 10-person builder doesn't need all the enterprise features they don't use. They need what they actually use, at a price that fits their size.",why:"The 'I get lost in Procore myself' line came directly from your conversation. That's the one to use."},
{cat:"Sydney",diff:"standard",q:"What proof do you have that users want this?",a:"Years of Justin's phone ringing with the same question — where is this in the drawings? Same question, different job, different person. That's not anecdotal. That's the proof. We also spoke to around 15 to 20 people before we built anything. The feedback was consistent — yes this is a problem, yes this would help. They kept asking when they could start using it. And there's a solution like this in the US already — the market is validated, it's just not been served in Australia.",why:"The phone ringing for years is your strongest line. It's real, it's specific, it requires no document."},
{cat:"Sydney",diff:"standard",q:"Where do you see Tensi in 5 years?",a:"Two outcomes — both good for investors. Either we're a strong acquisition target — companies like Procore, Trimble, Autodesk would want to buy us because it's easier to acquire us than build what we've built at the price point we serve. Or we continue expanding into other markets where those players have no footprint. Both paths create a return. We're building the business that creates those options.",why:"You said 'easier to buy us than build it at this price point.' That exact phrase is the answer."},
{cat:"Sydney",diff:"hard",q:"What is your exit strategy and realistic timeline?",a:"At 3 to 4 years we expect to have significant ARR. At that point we'll have expanded to different markets where these players have no footprint. That makes it easy for them to buy us rather than roll out their own product. They're selling at premium enterprise pricing. We're building what they can't profitably reach. If they want that market, buying Tensi is the fastest path. We don't need to chase the exit — we build the product that makes the exit obvious.",why:"The exit logic is simple: we go where they can't. When we're there, they buy us."},
{cat:"Sydney",diff:"medium",q:"What does success look like at the end of the $1.2M raise?",a:"50 to 150 paying customers with strong daily active use. A steady increase in active users month on month — not a spike, then flat. Positive feedback consistently. AI accuracy above benchmark. A strong indication that people love the product and there's real traction. That's the validation we need to raise more capital at the next round. Where we're putting the money and what comes out of it — that's how we measure success.",why:"You said this clearly in your conversation: 'where we're putting the money and what the output is — that's the validation.'"},
{cat:"Sydney",diff:"hard",q:"If this fails, what did you learn and what would you do differently?",a:"We're not going to wait until we fail to act. The $1.2M isn't going to last forever and we know that. We need to get validation as quickly as possible. We're already getting customers out and getting feedback from alpha. If something isn't working, we fix it immediately. We don't wait for failure — we watch the metrics and respond. The investment is there to learn fast and move fast, not to run out the clock.",why:"Your answer in the conversation was sharp: 'We're not going to fail at that point — we're going to be getting customers out.' Turn it around from defensive to offensive."},
{cat:"Sydney",diff:"hard",q:"What's your biggest risk and what's the contingency?",a:"The biggest risk is how quickly we can go to market. Because of how fast AI is moving, if we don't get to market quickly with a product customers want, we lose that first-mover advantage. We lose the comfort of being first. The market is there. The problem is real. Nobody in Australia is solving it properly. That's not going to last forever. The contingency is that we're already live in alpha and moving. The raise accelerates that timeline significantly.",why:"Speed to market was your honest answer. Not product risk, not team risk — timing. That's credible and shows strategic awareness."},
{cat:"Sydney",diff:"hard",q:"What stops Procore or Autodesk from building exactly what you're building?",a:"We saw it live at Sydney Build Expo. They've integrated AI — but look at how. They took what they already built and plugged generic AI on top. They haven't built AI-native from day one. That's a fundamentally different product. Their legacy systems are complex by design. And importantly — Tier 2 and 3 builders are not their primary customers. Cannibalising their enterprise pricing to serve SMEs doesn't make business sense for them. By the time they could move, we have the data, the users, and the network they can't replicate quickly.",why:"The Sydney Build Expo observation is real and specific. You saw it firsthand. Use it."},
{cat:"Sydney",diff:"medium",q:"Why are you the right team to build this?",a:"We saw the problem as founders — we're living it every day. When we brought Giri and the others on, it didn't take much convincing at all. They understood it immediately despite having no construction background. That's a sign of a real problem. If people with no skin in the industry can see it clearly, the problem is obvious. We have the industry know-how — 25 years for Justin, 15 for me. And we have the tech know-how through Giri, Sudhi, and the team. That combination is rare and it's what makes this work.",why:"The Giri angle — no construction background and still immediately convinced — is your independent validation. Use it."},
{cat:"Sydney",diff:"medium",q:"Do you expect a board seat or advisory role with this raise?",a:"We don't need a board at this stage. What we want is an active investor. Someone who picks up the phone when we need advice. Someone with industry knowledge and network who helps us grow. Not someone who just reads a quarterly report and attends a meeting. We want guidance, knowledge, and connections — that's the real value at this stage. The governance can come later at seed when it makes sense.",why:"You said it directly: 'We want knowledge, network, guidance — not governance.' That's the answer."},
{cat:"Sydney",diff:"standard",q:"Why start in Australia and not go global from day one?",a:"You have to get it right here first. We know this market. We have credibility here. We have existing relationships with builders, consultants, and trades who already know and trust us. We can move faster in a market we understand than one we're cold-entering. Once the model is proven — the product, the GTM motion, the pricing — the expansion playbook is clear. Going global too early is how companies burn through capital and end up with nothing to show anywhere.",why:"Simple and direct. Get it right here first. Then the playbook writes itself."}
];

const ALL_Q=[...Q,...SYDNEY];
const cats=['All','⭐ Sydney','Market','Product & AI','Team','Financials','Equity & Deal','Risk','Vision & Exit','Founder'];
let idx=0,flipped=false,done=new Set(),filt='All',filtered=[...ALL_Q],txS=0,tyS=0,drag=false;

function init(){
  bTabs();bDrw();render();uProg();uStats();
  const ca=document.getElementById('ca');
  ca.addEventListener('touchstart',ts,{passive:true});
  ca.addEventListener('touchmove',tm,{passive:false});
  ca.addEventListener('touchend',te,{passive:true});
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight')next();
    else if(e.key==='ArrowLeft')prev();
    else if(e.key===' '){e.preventDefault();flip();}
  });
}

function tTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  document.getElementById('tb').textContent=next==='dark'?'☀':'☾';
  try{localStorage.setItem('tensi-theme',next);}catch(e){}
}

function bTabs(){
  document.getElementById('tabs').innerHTML=cats.map(c=>{
    const isSyd=c==='⭐ Sydney';
    const isActive=c==='All';
    return`<button class="tab${isActive?' active':''}${isSyd?' sydney-tab':''}" onclick="sF('${c}',this)">${c}</button>`;
  }).join('');
}

function sF(cat,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  filt=cat;
  if(cat==='All') filtered=[...ALL_Q];
  else if(cat==='⭐ Sydney') filtered=[...SYDNEY];
  else filtered=Q.filter(q=>q.cat===cat);
  idx=0;flipped=false;document.getElementById('fc').classList.remove('flipped');
  render();uProg();bDrw();
}

function render(){
  if(!filtered.length)return;
  const c=filtered[idx];
  document.getElementById('fcat').textContent=c.cat;
  document.getElementById('fnum').textContent=String(idx+1).padStart(2,'0');
  document.getElementById('fq').textContent=c.q;
  const d=document.getElementById('fdiff');
  d.textContent=c.diff.charAt(0).toUpperCase()+c.diff.slice(1);
  d.className='diff '+c.diff;
  document.getElementById('bqt').textContent=c.q;
  let h='';
  if(c.nums){
    h+=`<div class="nbox">${c.nums.split('|').map(s=>{const p=s.trim().split(':');return p.length>1?`<b>${p[0]}:</b>${p.slice(1).join(':')}`:s.trim();}).join('<br>')}</div>`;
  }
  h+=`<div class="albl">Answer</div><div class="abody">${c.a}</div>`;
  h+=`<div class="wbox"><div class="wlbl">Why They Ask This</div><div class="wbody">${c.why}</div></div>`;
  document.getElementById('bb').innerHTML=h;
  document.getElementById('bb').scrollTop=0;
  const gi=ALL_Q.indexOf(c);
  const db=document.getElementById('dbtn');
  db.classList.toggle('marked',done.has(gi));
  db.textContent=done.has(gi)?'✓ Practised':'✓ Done';
}

function uProg(){
  const t=filtered.length,c=idx+1;
  document.getElementById('pl').textContent=`Q ${c} of ${t}`;
  document.getElementById('pp').textContent=Math.round((idx/Math.max(t-1,1))*100)+'%';
  document.getElementById('pf2').style.width=((idx/Math.max(t-1,1))*100)+'%';
}

function uStats(){
  document.getElementById('dc2').textContent=done.size;
  document.getElementById('dd').textContent=done.size;
  document.getElementById('dt').textContent=ALL_Q.length;
  document.querySelectorAll('.dqic').forEach((el,i)=>{
    const gi=ALL_Q.indexOf(filtered[i]);
    el.classList.toggle('done',done.has(gi));
    el.textContent=done.has(gi)?'✓':'';
  });
}

function bDrw(){
  document.getElementById('dl').innerHTML=filtered.map((c,i)=>{
    const gi=ALL_Q.indexOf(c);
    return`<div class="dqi${i===idx?' cur':''}" onclick="gTo(${i});cDrw()">
      <span class="dqin">${String(i+1).padStart(2,'0')}</span>
      <span class="dqit">${c.q}</span>
      <span class="dqic${done.has(gi)?' done':''}">${done.has(gi)?'✓':''}</span>
    </div>`;
  }).join('');
}

function gTo(i){idx=i;flipped=false;document.getElementById('fc').classList.remove('flipped');render();uProg();bDrw();}
function flip(){flipped=!flipped;document.getElementById('fc').classList.toggle('flipped',flipped);}

function next(){
  if(idx<filtered.length-1){idx++;flipped=false;document.getElementById('fc').classList.remove('flipped');render();uProg();bDrw();}
  else{document.getElementById('csd').textContent=done.size;document.getElementById('cst2').textContent=filtered.length;document.getElementById('cscreen').classList.add('show');}
}

function prev(){
  if(idx>0){idx--;flipped=false;document.getElementById('fc').classList.remove('flipped');render();uProg();bDrw();}
}

function tDone(){
  const gi=ALL_Q.indexOf(filtered[idx]);
  done.has(gi)?done.delete(gi):done.add(gi);
  render();uStats();bDrw();
}

function restart(){document.getElementById('cscreen').classList.remove('show');gTo(0);}
function oDrw(){document.getElementById('drw').classList.add('open');document.getElementById('ov').classList.add('open');}
function cDrw(){document.getElementById('drw').classList.remove('open');document.getElementById('ov').classList.remove('open');}

function ts(e){txS=e.touches[0].clientX;tyS=e.touches[0].clientY;drag=false;}
function tm(e){
  const dx=e.touches[0].clientX-txS,dy=e.touches[0].clientY-tyS;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>10){
    drag=true;e.preventDefault();
    document.getElementById('sfl').classList.toggle('show',dx<-30);
    document.getElementById('sfr').classList.toggle('show',dx>30);
  }
}
function te(e){
  document.getElementById('sfl').classList.remove('show');
  document.getElementById('sfr').classList.remove('show');
  if(!drag)return;
  const dx=e.changedTouches[0].clientX-txS;
  if(Math.abs(dx)>60){dx<0?next():prev();}
  drag=false;
}

// Restore saved theme immediately
try{
  const saved=localStorage.getItem('tensi-theme');
  if(saved){
    document.documentElement.setAttribute('data-theme',saved);
  }
}catch(e){}

window.addEventListener('load',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const tb=document.getElementById('tb');
  if(tb)tb.textContent=cur==='dark'?'☀':'☾';
  setTimeout(()=>{document.getElementById('splash').classList.add('hidden');init();},1500);
});
</script>
</body>
</html>
