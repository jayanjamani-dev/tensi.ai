<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tensi — Investor Prep</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

[data-theme="dark"]{
  --bg:#002022;
  --bg2:#001818;
  --card:#002628;
  --card-back:#002224;
  --surface:#002628;
  --amber:#FFCD00;
  --amber-dim:rgba(255,205,0,0.1);
  --white:#F5F2EC;
  --muted:rgba(245,242,236,0.5);
  --border:rgba(245,242,236,0.12);
  --border-amber:rgba(255,205,0,0.25);
  --green:#4ecba0;
  --green-dim:rgba(78,203,160,0.1);
  --green-border:rgba(78,203,160,0.22);
  --red:#e07070;
  --red-dim:rgba(220,80,80,0.12);
  --shadow:0 20px 60px rgba(0,0,0,0.6);
  --logo-filter:none;
  --grain-blend:screen;
  --grain-opacity:1;
  --dot-color:rgba(245,242,236,0.22);
  --btn-text-on-amber:#0a1f18;
  --hover-bg:rgba(245,242,236,0.05);
}
[data-theme="light"]{
  --bg:#F5F2EC;
  --bg2:#EBE6DC;
  --card:#FFFFFF;
  --card-back:#FAFAF6;
  --surface:#FFFFFF;
  --amber:#D4A800;
  --amber-dim:rgba(212,168,0,0.1);
  --white:#002022;
  --muted:rgba(0,32,34,0.5);
  --border:rgba(0,32,34,0.12);
  --border-amber:rgba(212,168,0,0.3);
  --green:#1a7a5e;
  --green-dim:rgba(26,122,94,0.08);
  --green-border:rgba(26,122,94,0.25);
  --red:#b04848;
  --red-dim:rgba(176,72,72,0.1);
  --shadow:0 8px 24px rgba(0,32,34,0.08);
  --logo-filter:invert(0.92) brightness(0.15) sepia(1) hue-rotate(120deg) saturate(2);
  --grain-blend:multiply;
  --grain-opacity:0.5;
  --dot-color:rgba(0,32,34,0.1);
  --btn-text-on-amber:#002022;
  --hover-bg:rgba(0,32,34,0.06);
}
}

html,body{height:100%;background:var(--bg);color:var(--white);font-family:'Inter',sans-serif;overflow:hidden;transition:background 0.3s,color 0.3s}

/* ── GRAIN — prominent, matches brand image ── */
body::before{
  content:'';
  position:fixed;inset:0;z-index:0;
  pointer-events:none;
  opacity:var(--grain-opacity);
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.18'/%3E%3C/svg%3E");
  background-repeat:repeat;
  background-size:180px 180px;
  mix-blend-mode:var(--grain-blend);
}

#app,#splash,.drw,.ov,#cscreen{position:relative;z-index:1}

/* ── SPLASH ── */
#splash{
  position:fixed;inset:0;z-index:200;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  transition:opacity 0.5s,visibility 0.5s;
}
#splash::before{
  content:'';position:absolute;inset:0;
  opacity:var(--grain-opacity);
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.18'/%3E%3C/svg%3E");
  background-repeat:repeat;
  background-size:180px 180px;
  mix-blend-mode:var(--grain-blend);
  mix-blend-mode:var(--grain-blend);
  pointer-events:none;
}
#splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
.sp-eyebrow{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:4px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;position:relative;z-index:1}
.sp-logo{font-family:'Inter',sans-serif;font-size:clamp(64px,18vw,96px);font-weight:800;letter-spacing:-3px;color:var(--white);line-height:1;position:relative;z-index:1}
.sp-logo span{color:var(--amber)}
.sp-sub{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;position:relative;z-index:1;margin-top:4px}
.sp-bar{margin-top:48px;width:80px;height:1px;background:var(--border);overflow:hidden;position:relative;z-index:1}
.sp-bar::after{content:'';display:block;width:100%;height:100%;background:var(--amber);transform:translateX(-100%);animation:ld 1.3s ease forwards}
@keyframes ld{to{transform:translateX(0)}}

/* ── APP ── */
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* ── HEADER ── */
.hdr{
  padding:14px 20px 12px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  background:var(--bg);
}
.hdr-logo{
  font-family:'Inter',sans-serif;font-weight:800;
  font-size:18px;letter-spacing:-0.5px;color:var(--white);
  display:flex;align-items:center;gap:10px;
}
.hdr-logo span{color:var(--amber)}

.hdr-r{display:flex;align-items:center;gap:8px}
.done-pill{
  font-family:'Inter',sans-serif;font-size:10px;
  color:var(--amber);background:var(--amber-dim);
  padding:4px 10px;border-radius:2px;letter-spacing:1px;
}
.ibtn{
  background:none;border:1px solid var(--border);
  border-radius:4px;width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--muted);font-size:14px;transition:all 0.2s;
}
.ibtn:hover{border-color:var(--amber);color:var(--amber)}

/* ── TABS ── */
.tabs{
  display:flex;gap:6px;padding:10px 20px;
  overflow-x:auto;flex-shrink:0;
  border-bottom:1px solid var(--border);
  scrollbar-width:none;background:var(--bg);
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  font-family:'Inter',sans-serif;font-size:9px;letter-spacing:1.5px;
  text-transform:uppercase;padding:5px 12px;
  border:1px solid var(--border);border-radius:2px;
  background:transparent;color:var(--muted);
  cursor:pointer;white-space:nowrap;transition:all 0.2s;flex-shrink:0;
}
.tab:hover{border-color:var(--amber);color:var(--amber)}
.tab.active{background:var(--amber);color:var(--btn-text-on-amber);border-color:var(--amber);font-weight:700}
.tab.sydney-tab{border-color:var(--green-border);color:var(--green)}
.tab.sydney-tab.active{background:var(--green);color:#001a14;border-color:var(--green)}

/* ── PROGRESS ── */
.pw{padding:10px 20px 6px;flex-shrink:0;background:var(--bg)}
.pi{display:flex;justify-content:space-between;margin-bottom:6px}
.pl{font-family:'Inter',sans-serif;font-size:10px;color:var(--muted);letter-spacing:1px}
.pp{font-family:'Inter',sans-serif;font-size:10px;color:var(--amber);letter-spacing:1px}
.pb{height:1px;background:var(--border);overflow:hidden}
.pf{height:100%;background:var(--amber);transition:width 0.3s}

/* ── CARD AREA ── */
.ca{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:12px 20px;position:relative;overflow:hidden;
  background:var(--bg);
}
.sf{
  position:absolute;top:50%;transform:translateY(-50%);
  font-family:'Inter',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:3px;text-transform:uppercase;
  pointer-events:none;opacity:0;transition:opacity 0.15s;z-index:10;
}
.sf.l{right:20px;color:var(--amber)}
.sf.r{left:20px;color:var(--green)}
.sf.show{opacity:1}

/* ── FLASHCARD ── */
.fw{width:100%;max-width:580px;height:100%;perspective:1400px;cursor:pointer}
.fc{
  width:100%;height:100%;position:relative;
  transform-style:preserve-3d;
  transition:transform 0.55s cubic-bezier(0.4,0.2,0.2,1);
  border-radius:0;
}
.fc.flipped{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:var(--shadow);
}

/* FRONT */
.front{background:var(--card);border:1px solid var(--border)}
.front::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  opacity:var(--grain-opacity);
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.18'/%3E%3C/svg%3E");
  background-repeat:repeat;
  background-size:180px 180px;
  mix-blend-mode:var(--grain-blend);
}
.ft{
  padding:16px 22px 12px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  position:relative;z-index:1;
}
.ctag{
  font-family:'Inter',sans-serif;font-size:9px;
  letter-spacing:2.5px;text-transform:uppercase;color:var(--amber);
}
.diff{
  font-family:'Inter',sans-serif;font-size:9px;
  padding:2px 8px;text-transform:uppercase;letter-spacing:1px;
}
.diff.hard{color:var(--red);border:1px solid var(--red-dim)}
.diff.medium{color:var(--amber);border:1px solid var(--border-amber)}
.diff.standard{color:var(--green);border:1px solid var(--green-border)}

.fb{
  flex:1;display:flex;flex-direction:column;
  align-items:flex-start;justify-content:flex-end;
  padding:28px 28px 32px;
  position:relative;z-index:1;
}
.qnum{
  font-family:'Inter',sans-serif;font-size:10px;
  color:var(--muted);letter-spacing:2px;
  margin-bottom:16px;
}
.qtxt{
  font-size:clamp(20px,4.5vw,28px);
  font-weight:800;line-height:1.25;
  color:var(--white);margin-bottom:28px;
  letter-spacing:-0.5px;
}
.qtxt em{color:var(--amber);font-style:normal}
.th{
  font-family:'Inter',sans-serif;font-size:9px;
  color:var(--muted);letter-spacing:2px;text-transform:uppercase;
  display:flex;align-items:center;gap:8px;
}
.th::before{content:'';display:block;width:16px;height:1px;background:var(--muted)}

/* BACK */
.back{
  background:var(--card-back);
  border:1px solid var(--green-border);
  transform:rotateY(180deg);
}
.back::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  opacity:0.6;
  background-image:radial-gradient(circle, var(--dot-color) 1px, transparent 1.2px);
  background-size:16px 16px;
  background-position:0 0;
}
.bt{
  padding:14px 22px 12px;
  border-bottom:1px solid var(--green-border);
  display:flex;align-items:center;justify-content:space-between;
  position:relative;z-index:1;flex-shrink:0;
}
.blbl{font-family:'Inter',sans-serif;font-size:9px;letter-spacing:2.5px;color:var(--green);text-transform:uppercase}
.bqt{font-family:'Inter',sans-serif;font-size:9px;color:var(--muted);max-width:55%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bb{
  flex:1;overflow-y:auto;padding:20px 24px;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
  position:relative;z-index:1;
}
.bb::-webkit-scrollbar{width:2px}
.bb::-webkit-scrollbar-thumb{background:var(--border)}

.nbox{
  background:rgba(255,205,0,0.06);
  border:1px solid var(--border-amber);
  padding:14px 18px;margin-bottom:18px;
  font-family:'Inter',sans-serif;font-size:13px;line-height:2;
  color:var(--muted);
}
.nbox b{color:var(--amber);font-weight:600}
.albl{
  font-family:'Inter',sans-serif;font-size:9px;letter-spacing:2.5px;
  text-transform:uppercase;color:var(--green);margin-bottom:12px;
}
.abody{
  font-size:16px;line-height:1.85;color:var(--white);
  border-left:2px solid var(--green-border);
  padding-left:16px;margin-bottom:18px;
  font-weight:400;
}
.wbox{
  background:rgba(0,0,0,0.04);
  border:1px solid var(--border);
  padding:12px 16px;margin-bottom:12px;
}
